# Blueprint cho Render - https://render.com/docs/blueprint-spec
#
# File nay phai nam o GOC repo. Repo chua nhieu tuan nen rootDir tro vao
# thu muc cua bai Week 7.
#
# Cach dung: Render Dashboard > New > Blueprint > chon repo nay.
# Render se doc file nay, tao 1 web service + 1 PostgreSQL, va hoi ban
# nhung bien danh dau "sync: false" (cac bi mat cua SMTP).

services:
  - type: web
    name: hoalvh-baitap-web-tuan7-ch14email
    runtime: docker
    plan: free
    region: singapore          # gan Viet Nam nhat
    rootDir: Week7/ch14email
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # --- CSDL: Render tu dien, khong phai go tay -------------------------
      # docker-entrypoint.sh doi chuoi "postgresql://..." nay thanh JDBC URL.
      - key: DATABASE_URL
        fromDatabase:
          name: hoalvh-baitap-web-tuan7-db
          property: connectionString

      # Goi free cua Render Postgres gioi han so ket noi, va instance free hay
      # bi khoi dong lai - de pool nho cho an toan.
      - key: DB_MAX_TOTAL
        value: "10"
      - key: DB_MAX_IDLE
        value: "5"

      # --- Gui mail --------------------------------------------------------
      # Render goi free CHAN outbound port 25 / 465 / 587, nen KHONG dung
      # duoc Gmail. Brevo con mo SMTP o port 2525 va Render khong chan.
      - key: MAIL_MODE
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"

      # Dia chi hien o o "From". Khong phai bi mat nen de thang o day.
      # Voi Brevo, dia chi nay phai la sender da duoc xac minh trong tai khoan.
      - key: MAIL_FROM
        value: hoa12358h@gmail.com

      # Hai bien duoi day Render se HOI luc tao Blueprint lan dau, va KHONG
      # luu vao git:
      #   MAIL_USERNAME = SMTP login, dang xxxxx@smtp-brevo.com
      #   MAIL_PASSWORD = SMTP key, dang xsmtpsib-...
      # Ca hai lay o Brevo > Settings > SMTP & API > SMTP.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

  # --- Week 7: gio hang chuong 7 + thanh toan VNPay sandbox --------------
  - type: web
    name: hoalvh-baitap-web-tuan7-ch07cart-vnpay
    runtime: docker
    plan: free
    region: singapore
    rootDir: Week7/ch07cart-vnpay
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Lay trong email VNPay gui khi dang ky sandbox, khong luu vao git
      - key: VNP_TMN_CODE
        sync: false
      - key: VNP_HASH_SECRET
        sync: false

databases:
  - name: hoalvh-baitap-web-tuan7-db
    databaseName: murach
    plan: free
    region: singapore
